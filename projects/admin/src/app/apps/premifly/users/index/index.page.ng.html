<main class="apps-page">
  <a class="breadcrumb" routerLink="/app/premifly"><span aria-hidden="true" class="icon-[material-symbols--arrow-back]"></span>Premifly overview</a>
  <header class="page-header"><div><div class="eyebrow">PREMIFLY / USERS</div><h1>Your members.</h1><p>Browse the people using Premifly and their contact details.</p></div><span class="badge">{{ users().meta.total }} users</span></header>
  <section class="members-table" aria-label="Premifly users"><div class="table-scroll"><mat-table [dataSource]="users().data">
<ng-container matColumnDef="first_name">
		<mat-header-cell *matHeaderCellDef>First name</mat-header-cell>
		<mat-cell *matCellDef="let user"><a class="member-link" [routerLink]="['..', 'user', user.id]">{{ user.first_name || 'View member' }}</a></mat-cell>
	</ng-container>

	<ng-container matColumnDef="last_name">
		<mat-header-cell *matHeaderCellDef>Last name</mat-header-cell>
		<mat-cell *matCellDef="let user">{{user.last_name}}</mat-cell>
	</ng-container>

	<ng-container matColumnDef="contact">
		<mat-header-cell *matHeaderCellDef>Contact</mat-header-cell>
		<mat-cell *matCellDef="let user">
			<div class="flex flex-col">
				<span class="font-black">{{user.email}}</span>
				<span class="text-sm">{{user.phone}}</span>
			</div>
		</mat-cell>
	</ng-container>

	<mat-header-row
		*matHeaderRowDef="[ 'first_name', 'last_name', 'contact',]"
	></mat-header-row>
	<mat-row
		*matRowDef="let row; columns: ['first_name', 'last_name', 'contact'];"
	></mat-row>
<div *matNoDataRow class="empty-members">No users to display.</div>
</mat-table></div>
<mat-paginator
	[pageSizeOptions]="[5, 10, 20]"
	[pageIndex]="users().meta.current_page - 1"
	[pageSize]="users().meta.per_page"
	[length]="users().meta.total"
	(page)="handlePaginatorEvent($event)"
	showFirstLastButtons
/>

</section></main>
