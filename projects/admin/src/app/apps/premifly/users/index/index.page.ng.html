<mat-table [dataSource]="users().data">
	<ng-container matColumnDef="icon">
		<mat-header-cell *matHeaderCellDef></mat-header-cell>
		<mat-cell *matCellDef="let service">
			<span
				[class.icon-[logos--claude-icon]]="service.slug === 'claude'"
				[class.icon-[logos--openai-icon]]="service.slug === 'chatgpt'"
				[class.icon-[vscode-icons--file-type-gemini]]="service.slug === 'gemini'"
				[class.icon-[ri--grok-ai-fill]]="service.slug === 'grok'"
				[class.icon-[logos--netflix-icon]]="service.slug === 'netflix'"
				[class.icon-[cbi--prime-video]]="service.slug === 'prime-video'"
				[class.text-blue-400!]="service.slug === 'prime-video'"
				class="text-[25px]"
			></span>
		</mat-cell>
	</ng-container>
	<ng-container matColumnDef="first_name">
		<mat-header-cell *matHeaderCellDef>First name</mat-header-cell>
		<mat-cell *matCellDef="let user">{{user.first_name}}</mat-cell>
	</ng-container>

	<ng-container matColumnDef="last_name">
		<mat-header-cell *matHeaderCellDef>Last name</mat-header-cell>
		<mat-cell *matCellDef="let user">{{user.last_name}}</mat-cell>
	</ng-container>

	<ng-container matColumnDef="contact">
		<mat-header-cell *matHeaderCellDef>Contact</mat-header-cell>
		<mat-cell *matCellDef="let user">
			<div class="flex flex-col">
				<span class="font-black">{{user.email}}</span>
				<span class="text-sm">{{user.phone}}</span>
			</div>
		</mat-cell>
	</ng-container>

	<mat-header-row
		*matHeaderRowDef="[ 'first_name', 'last_name', 'contact',]"
	></mat-header-row>
	<mat-row
		*matRowDef="let row; columns: ['first_name', 'last_name', 'contact'];"
		class="cursor-pointer"
		[routerLink]="['service', row.id]"
	></mat-row>
</mat-table>
<mat-paginator
	[pageSizeOptions]="[users().meta.per_page, 5, 10, 20].sort()"
	[pageIndex]="users().meta.current_page - 1"
	[pageSize]="users().meta.per_page"
	[length]="users().meta.total"
	(page)="handlePaginatorEvent($event)"
	showFirstLastButtons
/>
