<div class="fixed inset-0 z-0 atmospheric-glow"></div>
<div
  class="fixed top-[-10%] right-[-10%] size-150 bg-primary-container/10 blur-[120px] pulse-red rounded-full z-0"
></div>
<!-- TopNavBar -->
<header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md">
  <nav
    class="flex justify-between items-center py-4 mx-auto w-full max-w-7xl px-gutter"
  >
    <a
      routerLink="/"
      class="font-bold text-title-lg font-title-lg text-primary"
    >
      Premifly
    </a>
    <div class="hidden gap-8 items-center md:flex">
      <a
        class="font-bold border-b-2 transition-colors text-primary border-primary font-label-lg text-label-lg"
        href="#"
        >Explore</a
      >
      <a
        class="transition-colors text-on-surface-variant font-label-lg text-label-lg hover:text-primary"
        href="#"
        >How it Works</a
      >
    </div>
    <a
      matButton="filled"
      [style.--mat-button-filled-container-shape]="'9999px !important'"
      [routerLink]="[user() ? 'dashboard' : 'subscribe' ]"
      routerLinkActive="hidden!"
    >
      @if (user()) { My dashboard } @else { Get Started }
    </a>
  </nav>
</header>

<router-outlet />

<!-- Footer -->
<footer class="py-12 mt-20 border-t bg-surface-container-low border-white/5">
  <div
    class="flex flex-col gap-8 justify-between items-center mx-auto w-full max-w-7xl md:flex-row px-gutter"
  >
    <div class="flex flex-col gap-4 items-center md:items-start">
      <div class="font-bold text-title-lg font-title-lg text-primary">
        Premifly
      </div>
      <p class="text-on-surface-variant font-body-md text-body-md">
        © 2024 Premifly Elite Subscriptions
      </p>
    </div>
    <div class="flex flex-wrap gap-8 justify-center">
      <a
        class="underline transition-all text-on-surface-variant font-body-md text-body-md hover:text-primary"
        href="#"
        >Privacy Policy</a
      >
      <a
        class="underline transition-all text-on-surface-variant font-body-md text-body-md hover:text-primary"
        href="#"
        >Terms of Service</a
      >
      <a
        class="underline transition-all text-on-surface-variant font-body-md text-body-md hover:text-primary"
        href="#"
        >Support</a
      >
      <a
        class="underline transition-all text-on-surface-variant font-body-md text-body-md hover:text-primary"
        href="#"
        >Contact</a
      >
    </div>
    <div class="flex gap-4">
      <div
        class="flex justify-center items-center w-10 h-10 rounded-full transition-colors cursor-pointer bg-surface-container-high hover:bg-primary-container/20"
      >
        <span class="icon-[material-symbols--share-outline] text-[20px]"
          >share</span
        >
      </div>
      <div
        class="flex justify-center items-center w-10 h-10 rounded-full transition-colors cursor-pointer bg-surface-container-high hover:bg-primary-container/20"
      >
        <span
          class="icon-[material-symbols--public] text-[20px]"
          role="img"
          [ariaHidden]="true"
          >public</span
        >
      </div>
    </div>
  </div>
</footer>
