<svg xmlns="http://www.w3.org/2000/svg" viewBox="264 112.7 272 272" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
